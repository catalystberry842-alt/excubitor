name: excubitor
repo: https://github.com/catalystberry842-alt/excubitor
sha: b4e8345db04e6736a6b9379c85033ebeb4cad61b
version: "0.1.0"
description: "Night sentry for Hermes turns: one per-turn ledger that dedups inbound replay, stops no-progress tool loops, enforces a spend cap, and alerts when a turn hangs without a reply. Disclosure — default notifier is log-only; optional ntfy.sh or webhook POSTs; one background watch thread; SQLite state in plugin-data/excubitor; no credentials or telemetry; fail-open on internal errors. Optional Desktop status-bar chip (desktop/plugin.js). Limitation — event.internal bypasses gateway hooks."
maintainer: catalystberry842-alt
tier: community
category: automation
requires_hermes: ">=0.21.0"
capabilities:
  provides_tools: []
  provides_hooks:
    - pre_gateway_dispatch
    - post_gateway_admission
    - pre_llm_call
    - post_llm_call
    - pre_tool_call
    - post_tool_call
    - post_api_request
    - agent_loop_stopped
  provides_middleware: []
  requires_env: []
