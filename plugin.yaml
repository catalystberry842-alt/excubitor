name: excubitor
version: 0.1.0
description: "Night sentry for Hermes turns: one per-turn ledger that dedups inbound replay, stops no-progress tool loops, enforces a spend cap, and alerts when a turn hangs without a reply."
author: "catalystberry842-alt"
license: MIT
manifest_version: 2
api_version: 1
requires_hermes: ">=0.21.0"
homepage: https://github.com/catalystberry842-alt/excubitor
tags: [gateway, reliability, budget, watchdog, dedup]
provides_hooks:
  - pre_gateway_dispatch
  - post_gateway_admission
  - pre_llm_call
  - post_llm_call
  - pre_tool_call
  - post_tool_call
  - post_api_request
  - agent_loop_stopped
provides_tools: []
config_schema:
  day_budget_usd:
    type: float
    default: 5.0
    label: Day budget (USD)
    description: "Hard day spend cap. pre_llm_call vetoes new turns once the day total reaches this; pre_tool_call blocks mid-turn."
  session_budget_usd:
    type: float
    default: 2.0
    label: Session budget (USD)
    description: "Per-session spend cap (same veto/block semantics as the day budget)."
  reply_deadline_minutes:
    type: float
    default: 5.0
    label: Reply deadline (minutes)
    description: "If an open turn has no outbound reply by this deadline, fire one alert drawn from the ledger."
  loop_threshold:
    type: int
    default: 6
    label: Loop threshold
    description: "Base count of same-tool+args calls with no new result hashes before treating the turn as a no-progress loop. Tightens as budget is consumed."
  loop_approve_first:
    type: bool
    default: true
    label: Ask before first loop block
    description: "On the first no-progress detection per tool per turn, escalate via approve (human gate) instead of hard-blocking. Later / high-spend detections always block."
  receipts_enabled:
    type: bool
    default: true
    label: Turn receipts
    description: "Store a plain-English receipt for each finished turn. Only turns with a dedup, loop block, cap veto, or hang are sent through the notifier."
  notifier:
    type: str
    choices: [log, ntfy, webhook]
    default: log
    label: Notifier
    description: "Where hang/cap/loop alerts go. Default is log only (no network)."
  ntfy_topic:
    type: str
    default: ""
    label: ntfy.sh topic
    description: "Topic name when notifier=ntfy. Posts to https://ntfy.sh/<topic>."
  webhook_url:
    type: str
    default: ""
    label: Webhook URL
    description: "HTTPS URL when notifier=webhook. POSTs a JSON alert body."
  allow_private_webhooks:
    type: bool
    default: false
    label: Allow private webhook targets
    description: "Explicitly allow HTTPS webhooks to private IPs. Loopback HTTP is always allowed for local tests; redirects and proxies are never used."
  price_table:
    type: dict
    default: {}
    label: Price overrides
    description: "Optional model -> {input_per_mTok, output_per_mTok} USD overrides. Empty uses the built-in small table; unknown models fall back to a conservative default."
  watch_interval_seconds:
    type: float
    default: 30.0
    label: Watch interval (seconds)
    description: "How often the background watcher scans open turns for missed deadlines."
  enabled:
    type: bool
    default: true
    label: Enabled
    description: "Master kill switch. When false every hook is a no-op (fail-open)."
  seen_ttl_hours:
    type: float
    default: 168.0
    label: Seen-message TTL (hours)
    description: "Prune id-based inbound dedup keys older than this (default 7 days)."
  text_dedup_seconds:
    type: float
    default: 120.0
    label: Text-only dedup window (seconds)
    description: "When a message has no platform id, drop matching text only inside this short replay window (default 120s). A later identical 'yes' is not silently dropped."
  turn_ttl_hours:
    type: float
    default: 72.0
    label: Closed-turn TTL (hours)
    description: "Prune closed ledger turns older than this (default 3 days)."
  max_tool_rows_per_turn:
    type: int
    default: 500
    label: Max tool rows per turn
    description: "Cap tool_call history rows retained per turn (bounds DB under loop storms)."
